services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: astromind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword_dev
      POSTGRES_DB: astromind
    ports:
      - "127.0.0.1:5432:5432" # Bind strictly to localhost, never public 0.0.0.0
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d astromind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: astromind-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379" # Bind strictly to localhost
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
